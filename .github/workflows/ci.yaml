name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - feature/test_ci
      # - dev
      # - 'feature/*'
      # - 'bugfix/*'
      # - 'release/*'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Start containers
        run: make ci-up-build  # starts app-prod and postgres

      - name: Run migrations
        run: make ci-migrate

      - name: Run Backend tests
        run: make ci-test

      - name: Run ESLint
        run: make ci-lint || true  # warnings won’t fail workflow
      
      - name: Run Frontend Type Check
        run: make ci-type-check || true  # warnings won’t fail workflow

      - name: Run npm build
        run: make ci-test-npm-build

      - name: Stop containers
        if: always()
        run: make ci-down
