services:
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    working_dir: /app
    environment:
      FRANKENPHP_DOCUMENT_ROOT: /app/public
    depends_on:
      - db
      - redis
      - opensearch
    command: php artisan octane:frankenphp --host=0.0.0.0 --port=80

  frontend:
    build:
      context: .  # Ensure build context is correct (root folder)
      dockerfile: docker/frontend/Dockerfile
      target: dev
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
    depends_on:
      - backend
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    working_dir: /app
    environment:
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    command: php artisan queue:work --tries=3 --timeout=60
    depends_on:
      - backend
      - db
      - redis
      - opensearch

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    restart: unless-stopped
    environment:
      cluster.name: ${OPENSEARCH_CLUSTER_NAME:-goosak-search}
      node.name: ${OPENSEARCH_NODE_NAME:-goosak-opensearch}
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.9.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      - opensearch
  cron:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan schedule:work
    depends_on:
      - backend
      - redis
    restart: unless-stopped

volumes:
  db_data:
  opensearch-data:
