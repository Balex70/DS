apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-cron
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}-cron
spec:
  schedule: {{ .Values.cron.schedule | quote }}

  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: {{ .Release.Name }}-cron
        spec:
          restartPolicy: Never

          containers:
            - name: cron
              image: "{{ .Values.cron.image.repository }}:{{ .Values.cron.image.tag }}"
              imagePullPolicy: {{ .Values.cron.image.pullPolicy }}
              workingDir: {{ .Values.cron.workingDir }}

              command:
                {{- toYaml .Values.cron.command | nindent 16 }}

              envFrom:
                - secretRef:
                    name: {{ .Release.Name }}-be-secrets
