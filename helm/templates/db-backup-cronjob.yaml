apiVersion: batch/v1
kind: CronJob

metadata:
    name: {{ .Release.Name }}-db-backup
    namespace: {{ .Values.namespace }}

spec:
    schedule: {{ .Values.dbBackup.schedule | quote }}
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3

    jobTemplate:
        spec:
            backoffLimit: 2

            template:
                spec:
                    restartPolicy: Never

                    containers:
                        - name: db-backup
                          image: "{{ .Values.dbBackup.image.repository }}:{{ .Values.dbBackup.image.tag }}"

                          envFrom:
                              - secretRef:
                                  name: {{ .Release.Name }}-be-secrets

                          env:
                              - name: PGHOST
                                value: {{ .Release.Name }}-db

                              - name: PGPORT
                                value: {{ .Values.db.port | quote }}

                              - name: PGPASSWORD
                                valueFrom:
                                    secretKeyRef:
                                        name: {{ .Release.Name }}-be-secrets
                                        key: DB_PASSWORD

                              - name: BACKUP_DIR
                                value: /backups

                          command:
                              - /bin/sh
                              - -c
                              - |
                                  set -e

                                  TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
                                  BACKUP_FILE="${BACKUP_DIR}/db-${TIMESTAMP}.sql.gz"

                                  echo "Creating database backup: ${BACKUP_FILE}"

                                  pg_dump \
                                      -U "${DB_USERNAME}" \
                                      -d "${DB_DATABASE}" \
                                      | gzip > "${BACKUP_FILE}"

                                  echo "Backup completed successfully"

                          volumeMounts:
                              - name: backups
                                mountPath: /backups

                    volumes:
                        - name: backups
                          hostPath:
                              path: {{ .Values.dbBackup.hostPath }}
                              type: DirectoryOrCreate
