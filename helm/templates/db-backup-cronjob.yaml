apiVersion: batch/v1
kind: CronJob

metadata:
    name: {{ .Release.Name }}-db-backup
    namespace: {{ .Values.namespace }}

spec:
    schedule: {{ .Values.dbBackup.schedule | quote }}
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3

    jobTemplate:
        spec:
            backoffLimit: 2

            template:
                spec:
                    restartPolicy: Never

                    containers:
                        - name: db-backup
                          image: "{{ .Values.dbBackup.image.repository }}:{{ .Values.dbBackup.image.tag }}"

                          envFrom:
                              - secretRef:
                                  name: {{ .Release.Name }}-be-secrets

                          env:
                              - name: PGHOST
                                value: {{ .Release.Name }}-db

                              - name: PGPORT
                                value: {{ .Values.db.port | quote }}

                              - name: PGPASSWORD
                                valueFrom:
                                    secretKeyRef:
                                        name: {{ .Release.Name }}-be-secrets
                                        key: DB_PASSWORD

                              - name: BACKUP_DIR
                                value: /backups

                          command:
                              - /bin/sh
                              - -c
                              - |
                                  set -e

                                  DATE=$(date +"%Y-%m-%d")
                                  YEAR_MONTH=$(date +"%Y-%m")
                                  DAY_OF_WEEK=$(date +"%u")
                                  DAY_OF_MONTH=$(date +"%d")

                                  DAILY_DIR="${BACKUP_DIR}/daily"
                                  WEEKLY_DIR="${BACKUP_DIR}/weekly"
                                  MONTHLY_DIR="${BACKUP_DIR}/monthly"

                                  mkdir -p \
                                      "${DAILY_DIR}" \
                                      "${WEEKLY_DIR}" \
                                      "${MONTHLY_DIR}"

                                  #
                                  # Daily backup
                                  #
                                  DAILY_FILE="${DAILY_DIR}/db-${DATE}.sql.gz"

                                  echo "Creating daily backup: ${DAILY_FILE}"

                                  pg_dump \
                                      -U "${DB_USERNAME}" \
                                      -d "${DB_DATABASE}" \
                                      | gzip > "${DAILY_FILE}"

                                  echo "Daily backup completed successfully"

                                  #
                                  # Weekly backup
                                  # Sunday = day 7
                                  #
                                  if [ "${DAY_OF_WEEK}" = "7" ]; then
                                      WEEKLY_FILE="${WEEKLY_DIR}/db-${DATE}.sql.gz"

                                      cp "${DAILY_FILE}" "${WEEKLY_FILE}"

                                      echo "Weekly backup created: ${WEEKLY_FILE}"
                                  fi

                                  #
                                  # Monthly backup
                                  # First day of the month
                                  #
                                  if [ "${DAY_OF_MONTH}" = "01" ]; then
                                      MONTHLY_FILE="${MONTHLY_DIR}/db-${YEAR_MONTH}.sql.gz"

                                      cp "${DAILY_FILE}" "${MONTHLY_FILE}"

                                      echo "Monthly backup created: ${MONTHLY_FILE}"
                                  fi

                                  #
                                  # Date-based retention
                                  #
                                  TODAY=$(date +%s)

                                  #
                                  # Daily: keep the last 7 calendar days
                                  #
                                  for FILE in "${DAILY_DIR}"/db-*.sql.gz; do
                                      [ -f "${FILE}" ] || continue

                                      NAME=$(basename "${FILE}")
                                      FILE_DATE=$(echo "${NAME}" | sed -E 's/db-([0-9]{4}-[0-9]{2}-[0-9]{2})\.sql\.gz/\1/')

                                      FILE_TIMESTAMP=$(date -d "${FILE_DATE}" +%s 2>/dev/null || true)

                                      if [ -z "${FILE_TIMESTAMP}" ]; then
                                          echo "Skipping invalid daily backup filename: ${FILE}"
                                          continue
                                      fi

                                      AGE_DAYS=$(( (TODAY - FILE_TIMESTAMP) / 86400 ))

                                      if [ "${AGE_DAYS}" -ge 7 ]; then
                                          echo "Removing old daily backup: ${FILE}"
                                          rm -f "${FILE}"
                                      fi
                                  done

                                  #
                                  # Weekly: keep the last 5 weekly backups
                                  #
                                  WEEKLY_FILES=$(find "${WEEKLY_DIR}" \
                                      -type f \
                                      -name "db-*.sql.gz" \
                                      | sort -r)

                                  WEEKLY_COUNT=0

                                  for FILE in ${WEEKLY_FILES}; do
                                      WEEKLY_COUNT=$((WEEKLY_COUNT + 1))

                                      if [ "${WEEKLY_COUNT}" -gt 5 ]; then
                                          echo "Removing old weekly backup: ${FILE}"
                                          rm -f "${FILE}"
                                      fi
                                  done

                                  #
                                  # Monthly: keep the last 12 monthly backups
                                  #
                                  MONTHLY_FILES=$(find "${MONTHLY_DIR}" \
                                      -type f \
                                      -name "db-*.sql.gz" \
                                      | sort -r)

                                  MONTHLY_COUNT=0

                                  for FILE in ${MONTHLY_FILES}; do
                                      MONTHLY_COUNT=$((MONTHLY_COUNT + 1))

                                      if [ "${MONTHLY_COUNT}" -gt 12 ]; then
                                          echo "Removing old monthly backup: ${FILE}"
                                          rm -f "${FILE}"
                                      fi
                                  done

                                  echo "Backup retention cleanup completed"

                          volumeMounts:
                              - name: backups
                                mountPath: /backups

                    volumes:
                        - name: backups
                          hostPath:
                              path: {{ .Values.dbBackup.hostPath }}
                              type: DirectoryOrCreate
