apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migration
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-migration
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          command:
            - sh
            - -c
            - |
              # Wait for DB (Postgres) service to be ready
              until nc -z {{ .Release.Name }}-db 5432; do
                echo "Waiting for DB (Postgres)..."
                sleep 2
              done
              # Run migration
              php artisan migrate
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-secrets
