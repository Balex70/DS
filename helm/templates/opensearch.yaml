apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-opensearch
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}-opensearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-opensearch
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-opensearch
    spec:
      volumes:
        - name: opensearch-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-opensearch-pvc
      containers:
        - name: opensearch
          image: "{{ .Values.opensearch.image.repository }}:{{ .Values.opensearch.image.tag }}"
          imagePullPolicy: {{ .Values.opensearch.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.opensearch.port }}
          env:
            - name: discovery.type
              value: single-node
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: {{ .Values.opensearch.javaOpts | quote }}
          resources:
            {{- toYaml .Values.opensearch.resources | nindent 12 }}
          volumeMounts:
            - name: opensearch-data
              mountPath: /usr/share/opensearch/data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-opensearch-pvc
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.opensearch.persistence.size }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-opensearch-service
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-opensearch
  ports:
    - port: {{ .Values.opensearch.port }}
      targetPort: {{ .Values.opensearch.port }}
      protocol: TCP
