namespace: prod-ds

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
# Web app configuration
backend:
  image:
    repository: bachynskyialex/ds-backend     # local image name (or Docker Hub later)
    tag: 0.0.1                 # local tag
    pullPolicy: Always  # Always | IfNotPresent | Never
  env:
    #don't need to now, leave for information purposes
    FRANKENPHP_DOCUMENT_ROOT: /app/public

frontend:
  image:
    repository: bachynskyialex/ds-frontend     # local image name (or Docker Hub later)
    tag: 0.0.1                 # local tag
    pullPolicy: Always

queue:
  image:
    repository: bachynskyialex/ds-backend
    tag: 0.0.1
    pullPolicy: Always

cron:
  image:
    repository: bachynskyialex/ds-backend
    tag: 0.0.1
    pullPolicy: Always

letsEncrypt:
  ## Possible values:
  # selfSigned -> self signed certificate issuer suited for local development
  # stage -> use https://acme-staging-v02.api.letsencrypt.org/directory server for issuer, suited for stage environment
  # prod -> use https://acme-v02.api.letsencrypt.org/directory server for issuer, suited for production
  type: prod
  # email in case stage or prod type of issuer is set
  email: bachynskyialex@gmail.com

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  tlsEnabled: true
  host: boobuu.com

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - somerealdomain.com
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
